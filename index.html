			<section data-markdown data-separator="---\n" data-separator-vertical="--\n">
				<script type="text/template">
				 # Conceptual evaluation
				 --
				 ## Natural questions
				 --
				 ‘Concepts’?

				 <span class="smaller">
				 <span class="fragment" data-fragment-index="1">abstracta</span><span class="fragment" data-fragment-index="2">, mental particulars</span><span class="fragment" data-fragment-index="3">, abilities</span><span class="fragment" data-fragment-index="4">, …</span>
				 </span>
				 <aside class="notes">
        			Questions of conceptual engineering may ultimately depend on how we answer these questions.
    			</aside>
				 --
				 <span class="fragment" data-fragment-index="1">(</span>concept change: possible?<span class="fragment" data-fragment-index="1">)</span>

				 <span class="fragment" data-fragment-index="2">vs.</span>

				 <span class="fragment" data-fragment-index="2">concept<span class="green">ual</span> change</span><span class="fragment green" data-fragment-index="3"> ✔︎</span>
				 <aside class="notes">
				 	For instance, conceptual engineering would make little sense on a high-octane version of atomist nativism.
				 	Fortunately, we can evaluate concepts whether or not concepts can change.
				 	So I'm going to set this question aside.
				 	I am going to assume, however, that one can acquire new concepts---or put them to use, or whatever.
				 </aside>
				 --
				 relevant features?
				 <aside class="notes">
				 	That does not mean, of course, we don't have to take a stand on what concepts are. 
				 	After all, different theories of concepts will attribute to them different features. 
				 </aside>
				 --
				 (e.g. concepts as prototypes)
				 --
				 **working assumption**

				 <span class="fragment" data-fragment-index="1">inferential dispositions</span><span class="fragment" data-fragment-index="2">, expressibility</span>
				 <aside class="notes">
				 	'Expressibility' is not the best term for what I have in mind. Rough thought: what concepts one has constraints what thoughts one can entertain.
				 </aside>
				 --
				 ‘Evaluation’?
				 <aside class="notes">
				 	At least three decision points.
				 </aside>
				 --
				 pragmatic vs. epistemic <!-- .element: class="smaller" --> 
				 --
				 local vs. global <!-- .element: class="smaller" --> 
				 --
				 intrinsic vs. extrinsic <!-- .element: class="smaller" --> 
				</script>
			</section>
			<section data-markdown data-separator="---\n" data-separator-vertical="--\n">
				<script type="text/template">
				 # Our concern
				 --
				 <span class="fragment highlight-current-green" data-fragment-index="1">global</span>, <span class="fragment highlight-current-green" data-fragment-index="3">epistemic</span>, <span class="fragment highlight-current-green" data-fragment-index="2">extrinsic</span>

				 <aside class="notes">
        			Focus on global issues lets me sidestep many questions about the nature of concepts. 
        			The same goes for instrumental evaluation. Relativize evaluation to particular goals. 
        			This helps cash out the sense in which we evaluate concepts from an epistemic perspective: the goals themselves are epistemic. 
    			 </aside>
				 --
				 ## Which epistemic goals?
				 --
				 **At least**: 
				- truth <!-- .element: class="fragment" data-fragment-index="1" --> 
				<span class="fragment green" data-fragment-index="3">about q</span>
				- explanation <!-- .element: class="fragment" data-fragment-index="2" -->
				<span class="fragment green" data-fragment-index="3">of why p</span>
				 --
				 Constraints: 
				 <span class="fragment">computational capacity</span><span class="fragment">, memory</span>
				</script>

				<script type="text/template">
				# The simple view
				--
				conceptual evaluation
				<br>
				<br>
				<span class="fragment green" data-fragment-index="1">⬆︎ </span>
				︎<br>
				<br>
				<span class="fragment" data-fragment-index="1">property evaluation</span>
				--
				## Presuppositions
				--
				metaphysical distinction among properties

				<span class="fragment">(e.g. Lewis 1983, Sider’s *Writing the Book*)</span>
				<aside class="notes">
					Presumably one might be moved to run away upon seeing talk of 'natural properties'. Here I will not press any 'in principle' objection to such talk.
				</aside>
				--
				to each concept a property
				--
				## Advantages
				--
				simple
				--
				plausible

				<span class="fragment">(at least <span class="green">sometimes</span>) </span>
				--
				(<span class="green">green</span> vs <span class="green">gr</span><span class="blue">ue</span>, etc.)
				</script>
			</section>

			<section data-markdown data-separator="---\n" data-separator-vertical="--\n">
				<script type="text/template">
				# Worries
				--
				## Varieties of explanatory purposes
				--
				Which concepts are best: sensitive to explanatory purpose
				--
				Which properties are natural: not so
				--
				(ok, ok, …) 
				<aside class="notes">
					Note: the reason isn't that I'm not allowing for an 'objective' notion of explanation.
				</aside>
				--
				Perhaps: a theory of what cries out for explanation

				**objectively speaking** <!-- .element: class="fragment green" --> 

				<aside class="notes">
					But the prospects of this aren't very good. Example of monkey typing out English sentence. Cries out for explanation for aliens? Not so clear. Roger's *salience condition* on p. 3.
				</aside>
				--
				## Higher-level explanation
				--
				Natural properties: typically ‘low-level’
				--
				Cf. Sider’s nihilism
				<aside class="notes">
					Interestingly, even one of the most ardent defenders of natural properties seems committed to the claim that, strictly speaking, the only facts there are (and hence, presumably, the only properties there are) are fundamental.

					And talk of ‘relative naturalness’ is hard to make sense of in the usual, Lewis-style syntactic way. See Ned Hall on this (p. 22)
				</aside>
				--
				Also: Kim (1992, etc.) on multiple realizability and reduction
				<aside class="notes">
					The thought is roughly that, granted projectibility is a good criterion for naturalness, psychological properties are not natural.
					This is all controversial: but the epistemic merits of the relevant conceptual distinctions cannot, I believe, called into question.
				</aside>
				--
				Finally: ‘empty’ concepts cannot map onto natural properties

				But: good explanations are chockfull of such concepts <!-- .element: class="fragment" --> 

				<aside class="notes">
					Think of: frictionless planes, perfectly rigid bodies, infinite populations in population biology.
					Granted, people like Amie think such concepts are instantiated. But I suspect she would agree they cannot map onto 'natural' properties.
				</aside>
				--

				## Good concepts everywhere
				--
				logic, mathematics, normative theory …
				--
				prospects of a unified theory of naturalness seem dim.

				<aside class="notes">
					And intuitively, we'd want a theory of good concepts that is unified.
				</aside>
				--
				Also: ‘fruitfulness’ is evidence of good concept,
				--
				but of natural property?
				--
				**contrast**

				natural kinds as <span class="green">homeostatic property clusters</span>:
				
				gives rise to plausible story of why natural kinds are projectible <!-- .element class="fragment" -->

				<span class="fragment">(e.g. Kornblith’s *Inductive Inference*) </span>

				--
				But absent a similar story for mathematics, normative theory, …

				</script>
			</section>
			<section data-markdown data-separator="---\n" data-separator-vertical="--\n">
				<script type="text/template">
				# Worries (II)

				--

				## ‘Patchy’ concepts
				--
				Concept/property relationship: it’s complicated
				--
				Consider (from Pietroski 2003):

				> <span class="fragment">This book weighs about a pound. It is available in bookstores everywhere.</span>
				
				--
				What to say about <span class="green">being a book</span>?
				--
				Or the start of the notorious ‘London’ passage from Chomsky's *New Horizons*: 
				--
				“We can regard London with or without regard to its population; from one point of view it is the same city if its people desert it; from another, we can say that London came to have a harsher feel to it through the Thatcher years, a comment on how people act and live.
				--
				“Referring to London, we can be talking about a location or area, people who sometimes live there, the air above it (but not too high), buildings, institutions, etc., in various combinations (as in ‘London is so unhappy, ugly, and polluted that it should be destroyed and rebuilt 100 miles away’, still being the same city).”
				--
				Finally, consider <span class="green">hardness</span> (from Wilson’s *Wandering Significance*)
				--
				scratch hardness (minerals) 
				--
				<span class="green">vs.</span> 
				--
				indentation hardness (metals) 
				--
				<span class="green">vs.</span> 
				--
				Shore hardness (rubber)
				--
				(Granted: <span class="green">maybe</span> all but one are figurative uses,

				but how does that help?) <!-- .element: class="fragment" --> 
				--
				Two options: 

				1. concept/property relation: heavily context-sensitive <!-- .element: class="fragment" -->
				2. concepts are mostly related to gerrymandered properties <!-- .element: class="fragment" -->

				<aside class="notes">The latter is Stoljar's Chomsky</aside>
				
				--
				if the latter, the simple view cannot be true
				
				--
				if the former: no benefit to having a single <span class="green">hardness</span> concept?
				</script>
			</section>

			<section data-markdown data-separator="---\n" data-separator-vertical="--\n">
				<script type="text/template">
				# A plea for ＿＿＿＿
				--
				(help?)
				--
				perhaps: concept evaluation supervenes on property evaluation?
				--
				**hunch**

				non-representational concepts may well be epistemically kosher

				--

				most clear with so-called <span class="green">mere expressive devices</span>

				(e.g. Horwich on ‘true’) <!-- .element: class="fragment" --> 

				<aside class="notes">
					But is this the only way in which a non-representational concept can be epistemically good? 
				</aside>

				--

				good making features minus representational content?

				--

				(too quick, I’m afraid)

				---
				**concern**

				massive holism will make it very hard to give a *theory*	
				--

				**hope**

				make room for pluralism about epistemically good concepts

				--

				Thanks.

				</script>
